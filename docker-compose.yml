services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5173
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on: [backend]
